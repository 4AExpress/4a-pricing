<script>
// Η διεύθυνση του JSON ζει πλέον στο fuel-freshness.js (FuelFreshness.URL) —
// μία πηγή, ώστε να μην αποκλίνει ανά σελίδα.
const API = 'https://4aexpress.com/api';

// Οι τύποι επίναυλου, οι ετικέτες τους και οι κάρτες ανά υπηρεσία έρχονται
// από το api/fuel_catalog.php. Οι τιμές ανά τύπο έρχονται ΕΤΟΙΜΕΣ, από τη
// fuel_pct() του server (half-up, bcmath). Η σελίδα ΔΕΝ πολλαπλασιάζει.
// Μόνο εμφανίζει, και για τη μεταβολή αφαιρεί δύο έτοιμες τιμές.
const STATION_TITLES = { GR: 'ΕΛΛΑΔΑ', CY: 'ΚΥΠΡΟΣ' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

function catType(cat, code) {
  if (!cat || cat.state !== 'ok') return null;
  return (cat.data.types || []).find(t => t.code === code) || null;
}

// Οι τύποι με πολλαπλασιαστή ≠ 1 (σήμερα ο AIR_CY) παίρνουν δικές τους
// κάρτες και ιστορικό. Ο κανόνας είναι δεδομένο της βάσης, όχι κωδικός.
function catExtraTypes(cat) {
  if (!cat || cat.state !== 'ok') return [];
  return (cat.data.types || []).filter(t => t.source && t.multiplier !== null && Number(t.multiplier) !== 1);
}

// Η τιμή ενός τύπου για τη γραμμή cache που επέλεξε η σελίδα, ως string
// του server («50.88»). null όταν ο server δεν έχει την ΙΔΙΑ εβδομάδα με την
// ΙΔΙΑ τιμή πηγής (π.χ. τη Δευτέρα, με άλλη έκδοση του cache): τότε «—».
function catPct(cat, type, row) {
  if (!cat || cat.state !== 'ok' || !type || !type.source || !row) return null;
  const w = (cat.data.weeks || []).find(x => x.week_start === row.week_start);
  if (!w || !w.src || w.src[type.source] === null || Number(w.src[type.source]) !== Number(row.pct)) return null;
  const v = w.pct ? w.pct[type.code] : null;
  return v === null || v === undefined ? null : v;
}

// Μεταβολή = διαφορά δύο ΕΤΟΙΜΩΝ τιμών του server, ό,τι βλέπει ο πελάτης.
function catDelta(next, curr) {
  return (next !== null && curr !== null)
    ? parseFloat((Number(next) - Number(curr)).toFixed(2)) : null;
}

function catMsg(cat) {
  if (!cat || cat.state === 'loading') return 'Φόρτωση…';
  if (cat.state === 'nologin') return '🔒 Απαιτείται σύνδεση';
  return '⚠️ Δεν φορτώθηκαν από τον server';
}

const MISSING_NOTE = 'Η εβδομάδα που εμφανίζεται δεν υπάρχει ακόμα, ή διαφέρει, στα δεδομένα του server — «—» αντί για τιμή. Ανανεώστε σε λίγα λεπτά.';

// Κάρτες ανά υπηρεσία, σε ενότητες ανά σταθμό. Μία κάρτα ανά υπηρεσία ανά
// σταθμό: η S1003 εμφανίζεται και στην ΕΛΛΑΔΑ και στην ΚΥΠΡΟ.
function servicesHtml(cat, currBySrc) {
  if (!cat || cat.state !== 'ok') return `<div class="svc-msg">${catMsg(cat)} για τις τιμές ανά υπηρεσία.</div>`;
  let missing = false;
  const html = Object.keys(STATION_TITLES).map(st => {
    const cards = (cat.data.cards || []).filter(c => c.station === st)
      .sort((a, b) => a.sort_order - b.sort_order);
    if (!cards.length) return '';
    return `<div class="station-title" data-station="${st}">${STATION_TITLES[st]}</div>
      <div class="services">${cards.map(c => {
        const t = catType(cat, c.fuel_type);
        const special = catExtraTypes(cat).some(x => x.code === c.fuel_type);
        let val, cls;
        if (!t || !t.source) { val = esc(t ? t.label_el : '—'); cls = 'warn'; }
        else {
          const v = catPct(cat, t, currBySrc[t.source]);
          if (v === null && currBySrc[t.source]) missing = true;
          val = v !== null ? v + '%' : '—';
          cls = special ? 'cy' : t.source;
        }
        return `
        <div class="svc${special ? ' highlight' : ''}" data-station="${st}" data-service="${esc(c.cms_service)}">
          <div class="svc-name">${esc(c.service_name)}</div>
          <div class="svc-code">${esc(c.cms_service)}</div>
          <div class="svc-pct ${cls}">${val}</div>
          <div class="svc-type">${esc(c.fuel_label)}</div>
          <div class="svc-zones">${esc((c.zones || []).join(', '))}</div>
          ${c.is_combi ? '<div class="svc-note">COMBI — επίναυλος στο σκέλος Ελλάδα↔κόσμος</div>' : ''}
        </div>`;
      }).join('')}</div>`;
  }).join('');
  return html + (missing ? `<div class="metric-note">${MISSING_NOTE}</div>` : '');
}

// Το `last-update` έγραφε την ώρα ΦΟΡΤΩΣΗΣ ΤΗΣ ΣΕΛΙΔΑΣ — δηλαδή «τώρα»,
// ακόμα κι όταν τα δεδομένα ήταν τριών εβδομάδων. Σε σελίδα που ανοίγει
// κανείς ειδικά για να ελέγξει τη φρεσκάδα, αυτό έλεγε το αντίθετο από
// την αλήθεια. Γεμίζει πλέον από το `fetched_at`, στη renderDashboard.

function badge(diff) {
  if (diff === null) return '—';
  const sign = diff > 0 ? '+' : '';
  const cls  = diff > 0 ? 'up' : 'down';
  return `<span class="badge ${cls}">${sign}${diff.toFixed(2)}%</span>`;
}

function calcDiff(arr, idx) {
  if (idx >= arr.length - 1) return null;
  return parseFloat((arr[idx].pct - arr[idx+1].pct).toFixed(2));
}

// «Δευτέρα 05/10/2026» από ISO. Μεσημέρι UTC, ώστε η ζώνη του browser να
// μην μετακινεί την ημέρα.
const GR_DAYS = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
function fmtViewDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00Z');
  if (isNaN(d.getTime())) return iso;
  const dd = String(d.getUTCDate()).padStart(2,'0');
  const mm = String(d.getUTCMonth() + 1).padStart(2,'0');
  return `${GR_DAYS[d.getUTCDay()]} ${dd}/${mm}/${d.getUTCFullYear()}`;
}

// Η εβδομάδα που ΠΕΡΙΕΧΕΙ την ημερομηνία προβολής. Ίδιο κριτήριο με το
// fuel-freshness.js: week_start <= iso <= week_end.
function pickByDate(rows, iso) {
  for (const r of (rows || []))
    if (r.week_start && r.week_end && r.week_start <= iso && iso <= r.week_end) return r;
  return null;
}
// Η επόμενη είναι η εβδομάδα που ΑΡΧΙΖΕΙ την επομένη του week_end της
// τρέχουσας — όχι η θέση 1 του πίνακα, που ίσχυε μόνο όσο το αρχείο ήταν
// φρέσκο.
function pickNext(rows, curr) {
  if (!curr || !curr.week_end) return null;
  const d = new Date(curr.week_end + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 1);
  const iso = d.toISOString().slice(0, 10);
  for (const r of (rows || [])) if (r.week_start === iso) return r;
  return null;
}

function renderDashboard(data, viewISO, cat) {
  const air  = data.air  || [];
  const road = data.road || [];

  // ΑΠΟ ΗΜΕΡΟΜΗΝΙΑ. Υποχώρηση στη σημαία του αρχείου μόνο αν καμία
  // εβδομάδα δεν περιέχει την ημερομηνία προβολής — ίδια προτεραιότητα
  // με το pick() του fuel-freshness.js.
  const currAir  = pickByDate(air,  viewISO) || air.find(r => r.is_current)  || null;
  const currRoad = pickByDate(road, viewISO) || road.find(r => r.is_current) || null;
  const nextAir  = pickNext(air,  currAir);
  const nextRoad = pickNext(road, currRoad);

  const currAirPct  = currAir  ? currAir.pct  : '—';
  const nextAirPct  = nextAir  ? nextAir.pct  : '—';
  const currRoadPct = currRoad ? currRoad.pct : '—';
  const nextRoadPct = nextRoad ? nextRoad.pct : '—';

  const currBySrc = { air: currAir, road: currRoad };
  const nextBySrc = { air: nextAir, road: nextRoad };

  // ΜΕΤΑΒΟΛΗ = ΕΠΟΜΕΝΗ − ΤΡΕΧΟΥΣΑ, υπολογισμένη από τις δύο γραμμές που
  // επιλέχθηκαν με ημερομηνία. Το πρόσημο φτάνει αυτούσιο στο badge():
  // θετική τιμή σημαίνει αύξηση επίναυλου και χρωματίζεται .badge.up
  // (κόκκινο), αρνητική μείωση και χρωματίζεται .badge.down (πράσινο).
  // Καμία αντιστροφή στο σημείο κλήσης, καμία υπόθεση για θέση στον πίνακα.
  const delta = (next, curr) => (next && curr)
    ? parseFloat((next.pct - curr.pct).toFixed(2)) : null;
  const diffAir      = delta(nextAir,  currAir);
  const diffRoad     = delta(nextRoad, currRoad);

  // Κάρτες για τους τύπους με πολλαπλασιαστή (Air Cyprus), από τον server.
  // Χωρίς σύνδεση ή χωρίς απάντηση: μία κάρτα με το μήνυμα, καμία τιμή.
  const extra = catExtraTypes(cat);
  let missing = false;
  const extraCards = (which) => {
    if (!extra.length) return `
        <div class="metric${which === 'next' ? ' next' : ''}">
          <div class="metric-label">Ειδικός επίναυλος — ${which === 'next' ? 'επόμενη' : 'τρέχουσα'}</div>
          <div class="metric-value warn">—</div>
          <div class="metric-sub">${catMsg(cat)}</div>
        </div>`;
    return extra.map(t => {
      const cr = currBySrc[t.source], nr = nextBySrc[t.source];
      const cv = catPct(cat, t, cr), nv = catPct(cat, t, nr);
      if ((cr && cv === null) || (nr && nv === null)) missing = true;
      if (which === 'curr') return `
        <div class="metric">
          <div class="metric-label">${esc(t.label_el)} — τρέχουσα</div>
          <div class="metric-value cy">${cv !== null ? cv + '%' : '—'}</div>
          <div class="metric-sub">${cr ? cr.week : '—'}</div>
        </div>`;
      const d = catDelta(nv, cv);
      return `
        <div class="metric next">
          <div class="metric-label">${esc(t.label_el)} — επόμενη</div>
          <div class="metric-value warn">${nv !== null ? nv + '%' : '—'}</div>
          <div class="metric-sub">${nr ? nr.week : '—'} ${d !== null ? badge(d) : ''}</div>
        </div>`;
    }).join('');
  };
  const extraCurr = extraCards('curr');
  const extraNext = extraCards('next');

  // History rows
  const mark = (r, curr, nxt) => r === curr ? 'current' : r === nxt ? 'next-row' : '';
  const histAir = air.map((r, i) => `
    <tr class="${mark(r, currAir, nextAir)}">
      <td>${r.week} ${r === currAir ? '<span class="badge curr">τρέχουσα</span>' : r === nextAir ? '<span class="badge nxt">επόμενη</span>' : ''}</td>
      <td>${r === currAir ? '<strong>' : ''}${r.pct.toFixed(2)}%${r === currAir ? '</strong>' : ''}</td>
      <td>${badge(calcDiff(air, i))}</td>
    </tr>`).join('');

  const histRoad = road.map((r, i) => `
    <tr class="${mark(r, currRoad, nextRoad)}">
      <td>${r.week} ${r === currRoad ? '<span class="badge curr">τρέχουσα</span>' : r === nextRoad ? '<span class="badge nxt">επόμενη</span>' : ''}</td>
      <td>${r === currRoad ? '<strong>' : ''}${r.pct.toFixed(2)}%${r === currRoad ? '</strong>' : ''}</td>
      <td>${badge(calcDiff(road, i))}</td>
    </tr>`).join('');

  // Ιστορικό των τύπων με πολλαπλασιαστή: τιμές του server ανά εβδομάδα,
  // μεταβολή = διαφορά δύο έτοιμων τιμών, όπως στις κάρτες.
  const histExtra = extra.map(t => {
    const rows = data[t.source] || [];
    const cr = currBySrc[t.source], nr = nextBySrc[t.source];
    const codes = [...new Set((cat.data.cards || []).filter(c => c.fuel_type === t.code).map(c => c.cms_service))];
    const body = rows.map((r, i) => {
      const v = catPct(cat, t, r);
      const d = catDelta(v, i < rows.length - 1 ? catPct(cat, t, rows[i + 1]) : null);
      return `
    <tr class="${mark(r, cr, nr)}">
      <td>${r.week} ${r === cr ? '<span class="badge curr">τρέχουσα</span>' : r === nr ? '<span class="badge nxt">επόμενη</span>' : ''}</td>
      <td>${r === cr ? '<strong>' : ''}${v !== null ? v + '%' : '—'}${r === cr ? '</strong>' : ''}</td>
      <td>${badge(d)}</td>
    </tr>`;
    }).join('');
    return { id: 'tab-t-' + t.code, label: `${esc(t.label_el)}${codes.length ? ' (' + esc(codes.join('/')) + ')' : ''}`, body };
  });

  const fetchedLbl = data.fetched_at
    ? data.fetched_at.substring(8,10)+'-'+data.fetched_at.substring(5,7)+'-'+
      data.fetched_at.substring(0,4)+' '+data.fetched_at.substring(11,16)
    : '—';
  document.getElementById('fetched-at').textContent = `Τελευταία ανάκτηση: ${fetchedLbl}`;
  // Ίδια πηγή, όχι το ρολόι του browser.
  document.getElementById('last-update').textContent = fetchedLbl;
  // Η ένδειξη γράφεται ΕΔΩ, με το ΙΔΙΟ viewISO που έκρινε τις εβδομάδες —
  // δεν μπορεί να αποκλίνει από την ημερομηνία που πράγματι χρησιμοποιήθηκε.
  const vlbl = document.getElementById('view-date-label');
  if (vlbl) vlbl.textContent = fmtViewDate(viewISO);

  document.getElementById('content').innerHTML = `

    <div class="section-header">Τρέχουσα & Επόμενη Εβδομάδα</div>
    <div class="section-body">
      <div class="metrics-row">
        <div class="metric">
          <div class="metric-label">AIR — τρέχουσα</div>
          <div class="metric-value air">${typeof currAirPct === 'number' ? currAirPct.toFixed(2)+'%' : currAirPct}</div>
          <div class="metric-sub">${currAir ? currAir.week : '—'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">ROAD — τρέχουσα</div>
          <div class="metric-value road">${typeof currRoadPct === 'number' ? currRoadPct.toFixed(2)+'%' : currRoadPct}</div>
          <div class="metric-sub">${currRoad ? currRoad.week : '—'}</div>
        </div>
${extraCurr}
      </div>
      <div class="metrics-row next-row">
        <div class="metric next">
          <div class="metric-label">AIR — επόμενη</div>
          <div class="metric-value warn">${typeof nextAirPct === 'number' ? nextAirPct.toFixed(2)+'%' : nextAirPct}</div>
          <div class="metric-sub">${nextAir ? nextAir.week : '—'} ${diffAir !== null ? badge(diffAir) : ''}</div>
        </div>
        <div class="metric next">
          <div class="metric-label">ROAD — επόμενη</div>
          <div class="metric-value warn">${typeof nextRoadPct === 'number' ? nextRoadPct.toFixed(2)+'%' : nextRoadPct}</div>
          <div class="metric-sub">${nextRoad ? nextRoad.week : '—'} ${diffRoad !== null ? badge(diffRoad) : ''}</div>
        </div>
${extraNext}
      </div>
      ${missing ? `<div class="metric-note">${MISSING_NOTE}</div>` : ''}
    </div>

    <div class="section-header">Ανά Service — ${currAir ? currAir.week : '—'}</div>
    <div class="section-body">
      ${servicesHtml(cat, currBySrc)}
    </div>

    <div class="section-header">Ιστορικό Εβδομάδων</div>
    <div class="section-body" style="padding: 12px 0 0;">
      <div style="padding: 0 16px;">
        <div class="tabs">
          <button class="tab active" onclick="showTab('tab-air',this)">AIR (S1003/S1012)</button>
${histExtra.map(h => `
          <button class="tab" onclick="showTab('${h.id}',this)">${h.label}</button>`).join('')}
          <button class="tab" onclick="showTab('tab-road',this)">ROAD (S1010/S1041)</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="tab-air">
          <thead><tr><th>Εβδομάδα</th><th>Επίναυλος</th><th>Μεταβολή</th></tr></thead>
          <tbody>${histAir}</tbody>
        </table>
${histExtra.map(h => `
        <table id="${h.id}" style="display:none;">
          <thead><tr><th>Εβδομάδα</th><th>Επίναυλος</th><th>Μεταβολή</th></tr></thead>
          <tbody>${h.body}</tbody>
        </table>`).join('')}
        <table id="tab-road" style="display:none;">
          <thead><tr><th>Εβδομάδα</th><th>Επίναυλος</th><th>Μεταβολή</th></tr></thead>
          <tbody>${histRoad}</tbody>
        </table>
      </div>
    </div>

    <p class="source">4A Express Worldwide — Επίναυλος Καυσίμων Διεθνών Μεταφορών — Αυτόματη ενημέρωση καθημερινά</p>
  `;
}

// Οι πίνακες ιστορικού δεν είναι σταθερή λίστα: οι τύποι με πολλαπλασιαστή
// έρχονται από τη βάση.
function showTab(id, btn) {
  document.querySelectorAll('.table-wrap table').forEach(t => t.style.display = 'none');
  document.getElementById(id).style.display = '';
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Φόρτωση JSON — μέσω fuel-freshness.js: ίδια πηγή, ίδιο cache και ίδιο
// κριτήριο εγκυρότητας με τις υπόλοιπες σελίδες. Η σελίδα εξακολουθεί να
// ζωγραφίζει ΟΛΟ το αρχείο (res.data), όχι μόνο την τρέχουσα εβδομάδα.
// Το αρχείο κρατιέται, ώστε η αλλαγή ημερομηνίας προβολής να ξαναζωγραφίζει
// χωρίς νέο δίκτυο.
let FUEL_DATA = null;
// Κατάσταση του καταλόγου από τον server: loading | nologin | error | ok.
let CAT = { state: 'loading' };

function paint() {
  if (!FUEL_DATA) return;
  // ΠΑΝΤΑ σήμερα. Η ημερομηνία δεν αλλάζεται από την οθόνη — το now είναι
  // παράμετρος ΜΟΝΟ στα harness (tests/frontend/dashboard.test.js).
  const iso = FuelFreshness.todayISO();
  // Η κατάσταση φρεσκάδας κρίνεται ΓΙΑ ΤΗΝ ΙΔΙΑ ημερομηνία που ζωγραφίζουμε.
  const res = FuelFreshness.check(FUEL_DATA, iso);
  renderDashboard(FUEL_DATA, iso, CAT);
  FuelFreshness.warningsBox(res, 'freshness');
  // Εδώ δεν μπαίνει σύνδεσμος: η σελίδα ΕΙΝΑΙ ο έλεγχος του επίναυλου.
  FuelFreshness.banner(res, 'freshness', { link: false });
}

FuelFreshness.load()
  .then(res => {
    if (!res.data) throw new Error(res.reason || 'δεν φορτώθηκαν δεδομένα');
    FUEL_DATA = res.data;
    paint();
  })
  .catch(err => {
    document.getElementById('error-container').innerHTML =
      `<div class="error-box">⚠️ Σφάλμα φόρτωσης δεδομένων: ${err.message}</div>`;
    document.getElementById('content').innerHTML = '';
  });

// Ο κατάλογος θέλει συνδεδεμένο χρήστη. Χωρίς σύνδεση οι AIR/ROAD από το
// cache φαίνονται κανονικά. Οι κάρτες υπηρεσιών και ο ειδικός επίναυλος
// γράφουν «Απαιτείται σύνδεση».
(function loadCatalog() {
  let u = null;
  try { u = JSON.parse(sessionStorage.getItem('4a_current_user') || 'null'); } catch (e) {}
  if (!u || !u._token) { CAT = { state: 'nologin' }; paint(); return; }
  fetch(API + '/fuel_catalog.php', { headers: { 'Authorization': 'Bearer ' + u._token } })
    .then(r => r.status === 401 ? null : r.json())
    .then(d => {
      CAT = d === null ? { state: 'nologin' }
          : (d && d.ok) ? { state: 'ok', data: d }
          : { state: 'error' };
      paint();
    })
    .catch(() => { CAT = { state: 'error' }; paint(); });
})();
</script>

<script>
(function(){
  var el = document.getElementById('nav-legal');
  if (!el) return;
  var u = null;
  try { u = JSON.parse(sessionStorage.getItem('4a_current_user') || 'null'); } catch (e) {}
  if (!u || !u._token) return;
  function apply(p){ el.style.display = (p && p.legal && p.legal.view) ? '' : 'none'; }
  try { apply(JSON.parse(sessionStorage.getItem('4a_perms') || 'null')); } catch (e) {}
  fetch('https://4aexpress.com/api/permissions.php', {headers:{'Authorization':'Bearer ' + u._token}})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok || !d.data || !d.data.permissions) return;
      sessionStorage.setItem('4a_perms', JSON.stringify(d.data.permissions));
      apply(d.data.permissions);
    })
    .catch(function(){});
})();
</script>
